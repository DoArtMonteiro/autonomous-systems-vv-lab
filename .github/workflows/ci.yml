name: verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe_suffix: ""
          - os: windows-latest
            exe_suffix: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      - name: Install cargo-audit
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit locked dependencies
        if: runner.os == 'Linux'
        run: cargo audit

      - name: Audit locked vv-rocket dependencies
        if: runner.os == 'Linux'
        run: cargo audit --file crates/vv-rocket/Cargo.lock

      - name: Install LLVM coverage support
        if: runner.os == 'Linux'
        run: |
          rustup component add llvm-tools-preview --toolchain 1.99.0
          cargo install cargo-llvm-cov --locked --version 0.9.1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust integration tests
        run: cargo test --locked --all-targets

      - name: Run Rust documentation tests
        run: cargo test --locked --doc

      - name: Enforce coverage threshold
        if: runner.os == 'Linux'
        run: cargo llvm-cov --locked --all-targets --fail-under-lines 80

      - name: Build release binary
        run: cargo build --locked --release

      # vv-rocket is a separate workspace so the vv-lab source hash and M1-M7 outputs stay unchanged.
      # Its pinned trace hashes make this step the cross-platform determinism check.
      - name: Check, lint, test and build vv-rocket
        run: |
          cargo fmt --manifest-path crates/vv-rocket/Cargo.toml -- --check
          cargo clippy --locked --manifest-path crates/vv-rocket/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path crates/vv-rocket/Cargo.toml
          cargo build --locked --release --manifest-path crates/vv-rocket/Cargo.toml

      # vv-exec (M12) is its own workspace and links vv-rocket as a library. Its tests include the
      # comparison of the engine statistics with the independent reference fixture.
      - name: Check, lint and test vv-exec
        run: |
          cargo fmt --manifest-path exec/Cargo.toml -- --check
          cargo clippy --locked --manifest-path exec/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path exec/Cargo.toml

      # M13: rerun both bundled investigations from their claims on this platform, recompute them
      # from scratch, and require the findings to be byte-identical to the committed evidence.
      - name: Reproduce the M13 investigations and compare them with the committed evidence
        shell: bash
        run: |
          cargo build --locked --release --manifest-path exec/Cargo.toml
          for c in corridor-noise g3-onset; do
            exec/target/release/vv-exec investigate exec/claims/m13/$c.json --output exec/target/m13-ci/$c
            exec/target/release/vv-exec investigate-verify exec/target/m13-ci/$c > exec/target/m13-ci/$c-verify.json
            cmp exec/target/m13-ci/$c/investigation.json docs/evidence/m13/$c/investigation.json
          done

      - name: Audit locked vv-exec dependencies
        if: runner.os == 'Linux'
        run: cargo audit --file exec/Cargo.lock

      - name: Enforce vv-rocket coverage threshold
        if: runner.os == 'Linux'
        run: cargo llvm-cov --locked --manifest-path crates/vv-rocket/Cargo.toml --all-targets --fail-under-lines 80

      - name: Test Python campaign and minimizer
        env:
          VV_LAB_BINARY: target/release/vv-lab${{ matrix.exe_suffix }}
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check M14 benchmark cases against their sources
        run: python scripts/m14_cases.py --check
      - name: Check M13 claim base cases against their source
        run: python scripts/m13_cases.py --check

      - name: Exercise M7 cross-process locking and publication without skips
        working-directory: tests
        run: |
          python -c "import sys; print('lock backend:', 'msvcrt.locking' if sys.platform == 'win32' else 'fcntl.flock')"
          python -m unittest -v test_sim_adapter_concurrency test_sim_adapter test_mission_control test_rocket_adapter 2>&1 | tee "$RUNNER_TEMP/m7-tests.log"
          if grep -n "skipped" "$RUNNER_TEMP/m7-tests.log"; then echo "M7 tests were skipped"; exit 1; fi

      - name: Minimize the M3 actuator stop failure
        env:
          VV_LAB_BINARY: target/release/vv-lab${{ matrix.exe_suffix }}
        run: python scripts/m3_minimize_failure.py scenarios/m3/nominal-stop.json --contracts scenarios/m3/contracts-stop.json --actuator scenarios/m3/actuator-continued-stop.json --contract-id stop_response --seed 42 --output runs/m3-stop-counterexample --max-candidates 8 --time-budget-seconds 30

      - name: Replay the original and reduced M3 artifacts
        run: |
          target/release/vv-lab${{ matrix.exe_suffix }} replay runs/m3-stop-counterexample/original/events.json
          target/release/vv-lab${{ matrix.exe_suffix }} replay runs/m3-stop-counterexample/reduced/events.json

      - name: Run deterministic scenario campaign
        run: python scripts/run_campaign.py --binary target/release/vv-lab${{ matrix.exe_suffix }} --suite all --variants standard,short-stall,fault-stress --seeds 42,1337 --max-runs 256 --max-cases 80 --max-artifact-bytes 67108864 --time-budget-seconds 120 --output-root runs/ci-${{ runner.os }}

      - name: Run bounded M3 verification campaign
        run: python scripts/run_campaign.py --binary target/release/vv-lab${{ matrix.exe_suffix }} --suite m3 --seeds 42,1337,2026 --max-runs 90 --max-cases 30 --max-artifact-bytes 67108864 --time-budget-seconds 120 --output-root runs/ci-m3-${{ runner.os }}

      - name: Run bounded M4 controller evaluation campaign
        run: python scripts/m4_campaign.py --binary target/release/vv-lab${{ matrix.exe_suffix }} --seeds 42,1337,2026 --max-invocations 90 --max-pairs 30 --max-artifact-bytes 67108864 --time-budget-seconds 120 --output-root runs/ci-m4-${{ runner.os }}

      - name: Run reduced bounded M9 landing campaign
        run: python scripts/m9_campaign.py --binary crates/vv-rocket/target/release/vv-rocket${{ matrix.exe_suffix }} --seeds 1000,1001 --faults nominal,altimeter_bias,thrust_loss --max-runs 100 --max-artifact-bytes 67108864 --time-budget-seconds 120 --output-root runs/ci-m9-${{ runner.os }}

      - name: Run reduced bounded M9.1 acceptance campaign
        run: python scripts/m91_campaign.py --binary crates/vv-rocket/target/release/vv-rocket${{ matrix.exe_suffix }} --seeds 2000,2001 --scenarios nominal,gnss_bias,gnss_dropout --policies robust,guarded,baseline_guarded --max-runs 100 --max-artifact-bytes 67108864 --time-budget-seconds 120 --output-root runs/ci-m91-${{ runner.os }}

      - name: Minimize the seeded natural sensor fault
        env:
          VV_LAB_BINARY: target/release/vv-lab${{ matrix.exe_suffix }}
        run: python scripts/minimize_failure.py scenarios/m2/g-zone-fault.json --seed 42 --output runs/ci-minimized --max-candidates 80 --time-budget-seconds 30

      - name: Replay the minimized event artifact
        run: target/release/vv-lab${{ matrix.exe_suffix }} replay runs/ci-minimized/final/events.json

      - name: Upload campaign artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-campaign
          path: |
            runs/ci-${{ runner.os }}/campaign-*
            runs/ci-m3-${{ runner.os }}/campaign-*
            runs/ci-m4-${{ runner.os }}/campaign-m4-*
            runs/ci-minimized
            runs/m3-stop-counterexample
          if-no-files-found: warn

    defaults:
      run:
        shell: bash

  compare-platform-output:
    name: Compare canonical Linux and Windows outputs
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download campaign fingerprints
        uses: actions/download-artifact@v4
        with:
          pattern: "*-campaign"
          path: platform-campaigns
          merge-multiple: false

      - name: Compare pinned fixture outputs
        run: python scripts/check_platform_artifacts.py --root platform-campaigns --require-m4
        shell: bash

  desktop:
    # The M11 desktop workspace (platform, domain hosts, studio shell). Windows only: the product
    # targets Windows 11 and the Tauri shell needs WebView2. The installer itself is built by
    # desktop/build.ps1 in the installer job below.
    name: desktop (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      - name: Build vv-lab for the ground-vehicle host tests
        run: cargo build --locked --release --bin vv-lab

      - name: Check, lint and test the desktop workspace
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/target/release/domains, desktop/target/release/engines, desktop/target/release/discovery | Out-Null
          cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --manifest-path desktop/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/Cargo.toml --locked

  installer:
    # Clean-checkout build of the Windows installer with desktop/build.ps1, then a silent per-user
    # install and the real-window UI test against the installed application. The installer, its
    # SHA-256 and the UI test screenshots are uploaded as artifacts.
    name: installer (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/studio/package-lock.json

      - name: Build the domain hosts, the studio and the NSIS installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop/build.ps1

      - name: Record the installer and its SHA-256
        id: installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer produced" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -Encoding ascii "$($setup.FullName).sha256"
          Write-Host "$($setup.Name) $($setup.Length) bytes sha256 $hash"
          "path=$($setup.FullName)" >> $env:GITHUB_OUTPUT

      - name: Install silently for the current user
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "${{ steps.installer.outputs.path }}" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA "VV Lab Studio"
          $expected = @(
            "vv-studio.exe", "uninstall.exe",
            "domains/rocket-landing/domain.json", "domains/rocket-landing/vv-domain-rocket.exe",
            "domains/ground-vehicle/domain.json", "domains/ground-vehicle/vv-domain-ground.exe", "domains/ground-vehicle/vv-lab.exe",
            "domains/reference-oscillator/domain.json", "domains/reference-oscillator/vv-domain-reference.exe",
            "engines/vv-exec.exe", "discovery/claims/m13/g3-onset.json", "discovery/claims/m13/corridor-noise.json",
            "discovery/cases/m13/g3-registered.json", "discovery/cases/m14/ground-zone-corridor.json"
          )
          foreach ($f in $expected) {
            if (-not (Test-Path (Join-Path $root $f))) { throw "missing after install: $f" }
          }
          # The bundled executables link the VC runtime statically: no import of VCRUNTIME140.dll.
          Get-ChildItem -Recurse $root -Filter *.exe | Where-Object Name -ne "uninstall.exe" | ForEach-Object {
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($_.FullName))
            if ($text -match "(?i)vcruntime140\.dll") { throw "$($_.Name) imports VCRUNTIME140.dll" }
          }
          # Headless self-test of the installed application (GUI subsystem: wait for the process).
          $report = Join-Path $env:RUNNER_TEMP "self-test.json"
          $t = Start-Process -FilePath (Join-Path $root "vv-studio.exe") -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($t.ExitCode -ne 0) { throw "self-test failed with exit code $($t.ExitCode)" }

      - name: UI test of the installed application
        # Informational on the hosted runner: there the studio starts and stays up, but WebView2 has
        # not opened its DevTools endpoint, so the test has nothing to drive. The acceptance UI test
        # runs on a desktop machine against the installer artifact of this job (docs/m11-acceptance.md).
        continue-on-error: true
        shell: pwsh
        run: |
          $wv = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue
          Write-Host "WebView2 runtime: $($wv.pv); session: $([Environment]::UserInteractive)"
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python desktop/studio/tests/ui_smoke.py --exe "$env:LOCALAPPDATA\VV Lab Studio\vv-studio.exe" --domains "" --port 9333 --shots "$env:RUNNER_TEMP\ui-shots"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python desktop/studio/tests/m15_journeys.py --exe "$env:LOCALAPPDATA\VV Lab Studio\vv-studio.exe" --domains "" --port 9334 --shots "$env:RUNNER_TEMP\ui-shots-m15"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Uninstall silently
        if: always()
        shell: pwsh
        run: |
          $u = Join-Path $env:LOCALAPPDATA "VV Lab Studio\uninstall.exe"
          if (Test-Path $u) { Start-Process $u -ArgumentList "/S" -Wait }

      - name: Upload the installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vv-lab-studio-installer
          path: |
            desktop/target/release/bundle/nsis/*-setup.exe
            desktop/target/release/bundle/nsis/*.sha256
          if-no-files-found: warn

      - name: Upload the UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vv-lab-studio-ui-shots
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: ignore
