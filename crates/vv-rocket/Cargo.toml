[package]
name = "vv-rocket"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Deterministic 6-DOF rigid-body dynamics of a rocket stage with reference verification"
publish = false

[[bin]]
name = "vv-rocket"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

# Separate from the root package so the vv-lab source hash and M1-M7 outputs stay unchanged.
[workspace]
