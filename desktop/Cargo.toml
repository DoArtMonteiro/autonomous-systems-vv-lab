# M11 desktop product. A separate workspace, like crates/vv-rocket, so the root vv-lab package, its
# Cargo.lock and the M1 canonical hashes stay unchanged. Nothing here is a dependency of the root package.
[workspace]
resolver = "3"
members = [
    "platform",
    "domain-rocket",
    "domain-ground",
    "domain-reference",
    "studio",
]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
vv-platform = { path = "platform" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

# Local iteration only: `cargo build --profile dev-release`. Same optimisation level, parallel
# code generation and no LTO, so a Studio relink takes seconds instead of minutes. The installer
# and CI keep `release`.
[profile.dev-release]
inherits = "release"
codegen-units = 16
lto = false
incremental = true
