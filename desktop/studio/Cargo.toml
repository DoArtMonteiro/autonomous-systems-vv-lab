[package]
name = "vv-studio"
description = "V&V Lab Studio: the Windows desktop shell of the Autonomous Systems V&V Lab"
version = "0.16.2"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
default-run = "vv-studio"

[[bin]]
name = "vv-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
vv-platform.workspace = true
vv-geo.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Same version and features as the platform's evidence export (cinematic module and environment
# packages): no new crate in the lock file.
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.4"

[target.'cfg(windows)'.dependencies]
# Free disk space before an install (GetDiskFreeSpaceExW); already in the lock through Tauri.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
