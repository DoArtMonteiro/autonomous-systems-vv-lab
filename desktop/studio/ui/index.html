<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>V&amp;V Lab Studio</title>
  <link rel="stylesheet" href="vendor/uplot/uPlot.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/discover.css">
  <link rel="stylesheet" href="css/mission.css">
  <link rel="stylesheet" href="css/control.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="appbar">
    <div class="brand" aria-label="V&amp;V Lab Studio">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">V&amp;V Lab <b>Studio</b></span>
    </div>
    <nav class="nav" aria-label="Workspaces">
      <button type="button" class="nav-btn" data-view="home" aria-keyshortcuts="1">Home</button>
      <button type="button" class="nav-btn" data-view="missions" aria-keyshortcuts="2">Missions</button>
      <button type="button" class="nav-btn nav-discover" data-view="discover" aria-keyshortcuts="3">Investigate</button>
      <span class="nav-sep" aria-hidden="true"></span>
      <button type="button" class="nav-btn nav-work" data-view="prepare" aria-keyshortcuts="4">Configure</button>
      <button type="button" class="nav-btn nav-work" data-view="run" aria-keyshortcuts="5">Analyse</button>
      <button type="button" class="nav-btn nav-work" data-view="compare" aria-keyshortcuts="6">Compare</button>
      <button type="button" class="nav-btn nav-work" data-view="library" aria-keyshortcuts="7">Records</button>
    </nav>
    <div class="appbar-end">
      <button type="button" class="nav-btn nav-settings" data-view="settings" aria-keyshortcuts="8">Settings</button>
      <span id="platform-status" class="status-dot" role="status" aria-live="polite">Starting</span>
      <button type="button" id="open-palette" class="kbd-btn" aria-keyshortcuts="Control+K" title="Command and search palette">Search <kbd>Ctrl K</kbd></button>
      <button type="button" id="open-help" class="kbd-btn" aria-keyshortcuts="?" title="Keyboard shortcuts"><kbd>?</kbd></button>
    </div>
  </header>
  <main id="view" tabindex="-1">
    <section id="startup" class="startup" aria-live="polite">
      <div class="startup-box">
        <span class="brand-mark big" aria-hidden="true"></span>
        <h1>V&amp;V Lab Studio</h1>
        <p id="startup-text">Starting the platform: discovering domain hosts and reading their catalogs.</p>
        <div class="startup-bar" aria-hidden="true"><span></span></div>
        <div id="startup-detail"></div>
      </div>
    </section>
    <section id="view-home" class="view" hidden aria-label="Home"></section>
    <section id="view-missions" class="view" hidden aria-label="Mission library"></section>
    <section id="view-mission" class="view view-mission" hidden aria-label="Mission player"></section>
    <section id="view-discover" class="view" hidden aria-label="Investigate: challenge a safety claim"></section>
    <section id="view-prepare" class="view" hidden aria-label="Configure a run"></section>
    <section id="view-run" class="view" hidden aria-label="Analyse a run"></section>
    <section id="view-compare" class="view" hidden aria-label="Compare runs"></section>
    <section id="view-library" class="view" hidden aria-label="Records: stored runs, scenarios and comparisons"></section>
    <section id="view-settings" class="view" hidden aria-label="Settings and about"></section>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root" hidden></div>
</body>
</html>
